name: Required Ubuntu 22.04 toolchain

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-22-04:
    name: Ubuntu 22.04 / GCC 12 / C++17
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify operating system
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = "ubuntu"
          test "${VERSION_ID}" = "22.04"
          printf 'os=%s\n' "${PRETTY_NAME}"
          uname -a

      - name: Install assignment dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            g++-12 \
            libssl-dev \
            libboost-all-dev \
            zlib1g-dev

      - name: Record required tool versions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/cmake --version
          /usr/bin/ninja --version
          /usr/bin/g++-12 --version
          /usr/bin/c++ --version
          dpkg-query -W \
            cmake ninja-build g++-12 \
            libssl-dev libboost-all-dev zlib1g-dev

      - name: Run PDF build and test commands
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin
          export PATH

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -O2"

          cmake --build build --parallel
          cmake --build build --target tests
          ./build/tests/unit_tests

      - name: Run reviewer clean-build command
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin
          export PATH

          rm -rf build
          test "$(/usr/bin/c++ -dumpversion | cut -d. -f1)" = "11"
          cmake -B build
          cmake --build build
          cmake --build build --target tests
          ./build/tests/unit_tests

      - name: Run strict GCC 12 build
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin
          export PATH

          cmake -B build-strict -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DHFT_WARNINGS_AS_ERRORS=ON

          cmake --build build-strict --target tests --parallel
          cmake --build build-strict --target hft_core_benchmark --parallel
          ./build-strict/tests/unit_tests

      - name: Run GCC 12 ASan and UBSan build
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin
          export PATH

          cmake -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DHFT_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

          cmake --build build-sanitize --target tests --parallel
          ./build-sanitize/tests/unit_tests

      - name: Run native public Binance live smoke
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin
          export PATH

          output_dir="${RUNNER_TEMP}/binance-live-smoke"
          metrics_file="${RUNNER_TEMP}/binance-live-smoke.metrics"

          cmake --build build-strict --target binance_capture --parallel
          ./build-strict/binance_capture \
            --venue spot \
            --symbols BTCUSDT \
            --duration 15 \
            --output-dir "${output_dir}" \
            2>"${metrics_file}"

          mapfile -t audit_files < <(
            find "${output_dir}" -maxdepth 1 -type f \
              -name 'market_data_spot_BTCUSDT_*.csv' \
              ! -name '*_orderbook.csv'
          )
          mapfile -t book_files < <(
            find "${output_dir}" -maxdepth 1 -type f \
              -name 'market_data_spot_BTCUSDT_*_orderbook.csv'
          )
          test "${#audit_files[@]}" -eq 1
          test "${#book_files[@]}" -eq 1

          audit_file="${audit_files[0]}"
          book_file="${book_files[0]}"
          audit_header='recv_tsec,recv_tnsec,venue,stream_kind,shard_id,conn_epoch,conn_seq,symbol,payload_json'
          book_header='tsec,tnsec,seqNo,id,type,side,bid0,bid1,bid2,bid3,bid4,bid_size0,bid_size1,bid_size2,bid_size3,bid_size4,ask0,ask1,ask2,ask3,ask4,ask_size0,ask_size1,ask_size2,ask_size3,ask_size4'

          test "$(head -n 1 "${audit_file}")" = "${audit_header}"
          test "$(head -n 1 "${book_file}")" = "${book_header}"

          audit_rows=$(( $(wc -l < "${audit_file}") - 1 ))
          book_rows=$(( $(wc -l < "${book_file}") - 1 ))
          test "${audit_rows}" -gt 0
          test "${book_rows}" -gt 0
          awk -F, '
            NR == 2 { found = 1; if (NF != 26) exit 1 }
            END { if (!found) exit 1 }
          ' "${book_file}"

          cut -d, -f4 "${audit_file}" | tail -n +2 | sort -u \
            >"${RUNNER_TEMP}/binance-live-smoke.streams"
          grep -qx depth_diff "${RUNNER_TEMP}/binance-live-smoke.streams"
          grep -qx depth5 "${RUNNER_TEMP}/binance-live-smoke.streams"
          grep -qx trade "${RUNNER_TEMP}/binance-live-smoke.streams"

          metric() {
            awk -F= -v key="$1" '$1 == key { print $2 }' "${metrics_file}"
          }

          test "$(metric run.status)" = success
          test "$(metric run.exit_code)" -eq 0
          test "$(metric source.complete_messages)" -eq "${audit_rows}"
          test "$(metric events.pre_audit_rejections)" -eq 0
          test "$(metric events.schema_rejections)" -eq 0
          test "$(metric events.sequence_gaps)" -eq 0
          test "$(metric events.crossed_books)" -eq 0
          test "$(metric writer.audit_rows_written)" -eq "${audit_rows}"
          test "$(metric writer.audit_rows_unwritten)" -eq 0
          test "$(metric writer.book_rows_written)" -eq "${book_rows}"
          test "$(metric writer.book_rows_unwritten)" -eq 0
          test "$(metric failure.capture)" = none
          test "$(metric failure.control)" = none
          test "$(metric failure.session)" = none
          test "$(metric failure.writer)" = none

          printf 'native_live_audit_rows=%s\n' "${audit_rows}"
          printf 'native_live_book_rows=%s\n' "${book_rows}"
          sha256sum "${audit_file}" "${book_file}"
          cat "${metrics_file}"
